name: 26FW 소진율 대시보드 갱신

on:
  # GitHub 예약 실행은 정각 무렵 혼잡 시 지연·누락될 수 있어 혼잡이 덜한 분에 돌리고 백업 실행을 둔다.
  # 원본이 안 바뀌었으면 커밋하지 않으므로 여러 번 돌아도 부작용 없음.
  schedule:
    - cron: '17 0 * * *'   # KST 09:17
    - cron: '47 1 * * *'   # KST 10:47 (백업 · 허브 오전 갱신 반영)
    - cron: '17 4 * * *'   # KST 13:17
    - cron: '47 5 * * *'   # KST 14:47 (백업)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 26fw-sellthrough
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-26fw.txt

      - run: pip install -r scripts/requirements-26fw.txt

      - name: 빌드·검증 (실패하면 커밋하지 않음)
        id: build
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          TZ: Asia/Seoul
          PYTHONUTF8: '1'
        run: python scripts/build_26fw.py

      - name: 변경 있으면 커밋·푸시
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 26fw-sellthrough/data/data.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "data: 26FW 소진율 ${{ steps.build.outputs.as_of }}"
          git pull --rebase origin main
          git push origin HEAD:main
