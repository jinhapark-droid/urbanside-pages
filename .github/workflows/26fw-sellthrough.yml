name: 26FW 소진율 대시보드 갱신

on:
  schedule:
    - cron: '7 0 * * *'   # KST 09:07
    - cron: '7 4 * * *'   # KST 13:07
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 26fw-sellthrough
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-26fw.txt

      - run: pip install -r scripts/requirements-26fw.txt

      - name: 빌드·검증 (실패하면 커밋하지 않음)
        id: build
        env:
          GDRIVE_OAUTH_TOKEN: ${{ secrets.GDRIVE_OAUTH_TOKEN }}
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
          DASH_PASSWORD: ${{ secrets.DASH_PASSWORD }}
          TZ: Asia/Seoul
          PYTHONUTF8: '1'
        run: python scripts/build_26fw.py

      - name: 변경 있으면 커밋·푸시
        if: steps.build.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 26fw-sellthrough/data/data.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "data: 26FW 소진율 ${{ steps.build.outputs.as_of }}"
          git pull --rebase origin main
          git push origin HEAD:main
